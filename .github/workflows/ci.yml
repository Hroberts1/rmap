# The checks CLAUDE.md asks for before every commit, on every push and PR.
# Third-party actions are pinned to full commit SHAs (version in the comment).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check

  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          echo "rustc=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-check-${{ steps.toolchain.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-check-${{ steps.toolchain.outputs.rustc }}-
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Raw-socket tests that need root stay #[ignore]d; this does not run them.
      - run: cargo test --workspace --locked

  msrv:
    name: MSRV build (rust-version 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with [workspace.package] rust-version in Cargo.toml.
      - run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-msrv-1.88-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-1.88-
      - run: cargo check --workspace --all-targets --all-features --locked
