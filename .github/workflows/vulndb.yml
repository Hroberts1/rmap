# Rebuilds rmap's vulnerability database from NVD + CISA KEV once a month.
# Each build becomes its own release (`vulndb-YYYY-MM-DD`), created as a
# draft with its files attached and then published, so it works with
# GitHub's immutable releases: once out, a month's file can't be changed.
# The manifest rmap reads (`vulns.json`) is deployed to GitHub Pages and
# names the current month's file. See "Vulnerability data" in README.md.
# Third-party actions are pinned to full commit SHAs (version in the comment).
name: Vulnerability data

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulndb
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build and publish vulns.db
    # Only main's code publishes, even when run by hand on another branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A sync without an API key takes ~25 minutes (~215 pages, 6 s apart) plus the build.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # No cargo cache: this job can write releases, so it builds from scratch.
      # Compiled in its own step so dependency build scripts never see the key.
      - run: cargo build --release --locked -p vulndb-build
      - name: Build the database
        env:
          # Optional; an unset secret is an empty string and the tool then
          # uses NVD's slower keyless rate limit.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          OUT_DIR: dist
        run: |
          mkdir dist
          target/release/vulndb-build
      - name: Publish this month's release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="vulndb-$(date -u +%Y-%m-%d)"
          # A second run on the same day gets its own tag: published
          # releases are immutable and their tags can never be reused.
          if gh release view "$tag" > /dev/null 2>&1; then
            tag="$tag-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          db_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/vulns.db"
          size=$(stat -c%s vulns.db)
          sha256=$(sha256sum vulns.db | cut -d' ' -f1)
          jq --argjson size "$size" --arg sha256 "$sha256" --arg db "$db_url" \
            '{schema_version, built_at, cve_count, source, size: $size, sha256: $sha256, db: $db}' \
            vulns.meta.json > vulns.json
          jq -e '.schema_version == 1 and .cve_count >= 500 and .size > 0
                 and (.sha256 | test("^[0-9a-f]{64}$"))' vulns.json
          cat vulns.json
          # Draft first with every file attached, then publish: an
          # immutable release refuses files added after publishing.
          gh release create "$tag" vulns.db vulns.json --draft --latest=false \
            --target "$GITHUB_SHA" --title "Vulnerability data $(date -u +%Y-%m-%d)" \
            --notes "rmap's CVE database, built by .github/workflows/vulndb.yml from the NVD API 2.0 and CISA KEV. rmap finds the current month's file through https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/vulns.json. This product uses the NVD API but is not endorsed or certified by the NVD."
          gh release edit "$tag" --draft=false --latest=false
          # The pointer goes live only once the file it names downloads
          # and matches, so rmap is never sent to a missing or wrong file.
          for i in 1 2 3 4 5; do
            got=$(curl -fsSL "$db_url" | sha256sum | cut -d' ' -f1) && [ "$got" = "$sha256" ] && break
            sleep 10
          done
          [ "$got" = "$sha256" ] || { echo "published vulns.db does not download or match"; exit 1; }
          mkdir ../site
          cp vulns.json ../site/vulns.json
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: point rmap at the new release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Separate job so only this step holds the Pages permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}vulns.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
