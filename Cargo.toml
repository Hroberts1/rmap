[package]
name = "rmap"
description = "A from-scratch network scanner in Rust with an interactive TUI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rmap-log = { workspace = true }
rmap-tui = { path = "crates/rmap-tui" }
tokio = { workspace = true }

[workspace]
members = ["crates/*", "tools/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
rmap-core = { path = "crates/rmap-core" }
rmap-detect = { path = "crates/rmap-detect" }
rmap-engine = { path = "crates/rmap-engine" }
rmap-log = { path = "crates/rmap-log" }
rmap-names = { path = "crates/rmap-names" }
rmap-oui = { path = "crates/rmap-oui" }
rmap-packet = { path = "crates/rmap-packet" }
rmap-report = { path = "crates/rmap-report" }
rmap-vuln = { path = "crates/rmap-vuln" }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync"] }
ratatui = "0.30"
# Raw-socket syscalls only (Linux raw backend in rmap-engine).
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The CVE database file (rmap-vuln). Bundled so no system SQLite is needed.
rusqlite = { version = "0.40", features = ["bundled"] }
# Downloading the CVE database (rmap-vuln). rustls on ring (no cmake/NASM)
# with the webpki-roots Mozilla CA bundle; no gzip, cookies or json.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
