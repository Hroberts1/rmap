[package]
name = "rmap-engine"
description = "Concurrent scan engine for rmap"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
rmap-core = { workspace = true }
rmap-log = { workspace = true }
rmap-packet = { workspace = true }
tokio = { workspace = true }

# Socket syscalls for the raw backend. Nothing else uses libc.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
